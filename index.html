<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Zasolenia V1.2.1</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 20px auto; padding: 0 10px; }
    .field { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; padding: 10px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #0056b3; }
    .result { margin-top: 15px; padding: 12px; background: #f0f0f0; border-radius: 4px; font-size: 18px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <h3>Kalkulator Zasolenia</h3>

  <div class="field">
    <label for="płyn">Objętość wywaru (ml / g):</label>
    <input type="text" id="płyn" placeholder="np. 350" oninput="oblicz()">
  </div>

  <div class="field">
    <label for="tare">Waga tare (g):</label>
    <input type="text" id="tare" placeholder="np. 35" oninput="oblicz()">
  </div>

  <div class="field">
    <label for="zasolenieTare">Zasolenie tare (%):</label>
    <input type="text" id="zasolenieTare" placeholder="np. 12" oninput="oblicz()">
  </div>

  <button onclick="oblicz()">Przelicz</button>

  <div class="result" id="wynik">Wynik: 0.00%</div>

  <script>
    function value(id) {
      const el = document.getElementById(id);
      if (!el) return 0;
      const input = el.value.trim().replace(',', '.');
      const val = parseFloat(input);
      return isNaN(val) ? 0 : val;
    }

    function oblicz() {
      const p = value('płyn');
      const t = value('tare');
      const zT = value('zasolenieTare');

      if (p <= 0) {
        document.getElementById('wynik').innerText = "Wynik: 0.00%";
        return;
      }

      // Wzór na całkowitą zawartość soli z tare podzieloną przez łączną masę (wywar + tare)
      const sol = t * (zT / 100);
      const lacznaMasa = p + t;
      const wynikZasolenia = (sol / lacznaMasa) * 100;

      document.getElementById('wynik').innerText = `Wynik: ${wynikZasolenia.toFixed(2)}%`;
    }
  </script>

</body>
</html>
